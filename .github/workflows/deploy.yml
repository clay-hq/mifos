name: Deploy
run-name: Deploy to ${{ inputs.environment || 'dev' }}

# Deploys to beta through cloud-run-deploy.yml, which builds the image from the Dockerfile and
# swaps it on the `mifos` Cloud Run service.
#
# The service itself (its env vars, which the image writes into assets/env.js at start, scaling,
# ingress) is owned by terraform: a deploy only ever changes the image.
#
# A push to main deploys to kravings-dev, so beta tracks main. A push has no inputs, so every
# inputs.environment below falls back to dev, the run title too. Production is deploy-prod.yml.
#
# Keyless sign-in as deployer@ is accepted from refs/heads/main only (terraform's
# github_deploy_branches), so a dispatch from any other branch is refused at the token exchange.

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Which project to deploy into
        type: choice
        default: dev
        options:
          - dev

jobs:
  deploy:
    permissions:
      contents: read
      # Lets cloud-run-deploy.yml sign in keyless as deployer@.
      id-token: write
    uses: ./.github/workflows/cloud-run-deploy.yml
    with:
      project_id: ${{ fromJSON('{"dev":"kravings-dev"}')[inputs.environment || 'dev'] }}
