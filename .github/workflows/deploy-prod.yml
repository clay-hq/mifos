name: Deploy to Prod
run-name: Deploy to prod

# Prod is a manual gate (workflow_dispatch only): it does NOT deploy on push to main, matching
# the other portals' and the backend services' deploy-to-prod convention. Run it from main;
# keyless sign-in refuses any other ref.
#
# Records under the GitHub environment `prod`.

on:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      actions: read
      contents: read
      # Lets clay-hq/workflows sign in keyless as deployer@ (its gcp-auth action) where
      # GCP_KEYLESS_PROJECTS lists the project.
      id-token: write
      deployments: read
    uses: clay-hq/workflows/.github/workflows/deploy-web.yml@main
    with:
      project_id: clay-api-prod
      service_name: mifos
      image_tag: ${{ github.sha }}
      app_environment: prod
      environment: prod
      build_args: |
        PUPPETEER_SKIP_DOWNLOAD_ARG=true
      secret_build_args: ''
      runs_on: ubuntu-24.04
    secrets:
      READ_PACKAGES_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
